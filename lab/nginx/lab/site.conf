root /var/www/html;
index index.php;

# nginx default is 1m; real PHP sites raise it to at least post_max_size.
client_max_body_size 16m;

# Level 0: combined. Level 1: JSON. error_log is inherited from nginx.conf.
access_log /var/log/nginx/access.log combined;
access_log /var/log/nginx/access_ext.json lab_json;

location / {
    try_files $uri $uri/ =404;
}

location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass php_fpm;
}
