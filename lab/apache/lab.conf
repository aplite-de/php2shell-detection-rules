ServerName lab

# Level 0 is untouched: default vhost keeps error.log and access.log (combined).
# Level 1: extended access log written alongside it, for every vhost.
# Never logged: body, Cookie, Authorization, query string (may carry session IDs).
# Apache escapes %{...}i (\" \\ \xhh). \xhh is not valid JSON: parse leniently.
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t\",\"client\":\"%a\",\"xff\":\"%{X-Forwarded-For}i\",\"method\":\"%m\",\"uri\":\"%U\",\"proto\":\"%H\",\"status\":%>s,\"bytes_in\":%I,\"bytes_out\":%O,\"duration_us\":%D,\"pid\":%P,\"keepalive_n\":%k,\"conn\":\"%X\",\"content_type\":\"%{Content-Type}i\",\"content_length\":\"%{Content-Length}i\",\"transfer_encoding\":\"%{Transfer-Encoding}i\",\"ua\":\"%{User-Agent}i\"}" lab_json
GlobalLog ${APACHE_LOG_DIR}/access_ext.json lab_json
