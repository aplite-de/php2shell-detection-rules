; Pin the defaults the lab depends on, so results do not drift with image changes.
; Stopgaps (memory_limit=-1, session.upload_progress.enabled=0) are NOT applied here.
display_errors = Off
log_errors = On
memory_limit = 128M
post_max_size = 8M
max_input_nesting_level = 64
max_input_vars = 1000
max_file_uploads = 20
session.upload_progress.enabled = On
