; Loaded after the image's docker.conf / zz-docker.conf, so these win.
[global]
; Level 0: master log (child exits, signals) to a file instead of stderr.
error_log = /var/log/php-fpm/fpm.log
log_level = notice

[www]
; Level 1: FPM access log with child PID (%p) and peak memory (%M).
; %r is the URI without query string.
access.log = /var/log/php-fpm/access.log
access.format = "%{%Y-%m-%dT%H:%M:%S%z}t pid=%p \"%m %r\" status=%s len=%l dur_ms=%{milli}d mem_kb=%{kilo}M cpu=%C%%"
